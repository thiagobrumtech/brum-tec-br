<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LinkedIn | Thiago Brum</title>

<meta http-equiv="refresh" content="2;url=https://www.linkedin.com/in/brum-thiago">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:
radial-gradient(circle at top,#112240,#020617);

font-family:Segoe UI,Arial,sans-serif;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

color:white;

overflow:hidden;

}

.card{

width:420px;

padding:45px;

border-radius:18px;

background:rgba(15,23,42,.85);

backdrop-filter:blur(15px);

border:1px solid rgba(56,189,248,.25);

text-align:center;

box-shadow:
0 0 25px rgba(14,165,233,.20);

}

.logo{

width:70px;
height:70px;

margin:auto;

border-radius:50%;

background:linear-gradient(135deg,#0ea5e9,#2563eb);

display:flex;

justify-content:center;

align-items:center;

font-size:34px;

margin-bottom:25px;

box-shadow:0 0 20px #38bdf8;

}

h1{

font-size:32px;

margin-bottom:8px;

}

h2{

font-size:18px;

font-weight:400;

color:#38bdf8;

margin-bottom:25px;

}

p{

color:#cbd5e1;

line-height:1.7;

margin-bottom:30px;

}

.button{

display:inline-block;

padding:14px 28px;

border-radius:8px;

background:#0ea5e9;

text-decoration:none;

color:white;

font-weight:bold;

transition:.3s;

}

.button:hover{

transform:translateY(-3px);

box-shadow:0 0 20px #38bdf8;

}

.loader{

margin:30px auto 0;

width:180px;

height:5px;

background:#1e293b;

border-radius:50px;

overflow:hidden;

}

.loader span{

display:block;

height:100%;

background:#38bdf8;

animation:load 2s linear forwards;

}

@keyframes load{

from{

width:0;

}

to{

width:100%;

}

}

.footer{

margin-top:35px;

font-size:12px;

color:#64748b;

}

</style>

<script>

setTimeout(function(){

window.location.href="https://www.linkedin.com/in/brum-thiago";

},2000);

</script>

</head>

<body>

<div class="card">

<div class="logo">

in

</div>

<h1>Thiago Brum</h1>

<h2>LinkedIn</h2>

<p>

Você está sendo redirecionado para meu perfil profissional.

</p>

<a class="button"

href="https://www.linkedin.com/in/brum-thiago">

Abrir agora

</a>

<div class="loader">

<span></span>

</div>

<div class="footer">

brum.tec.br

</div>

</div>

</body>

</html>
